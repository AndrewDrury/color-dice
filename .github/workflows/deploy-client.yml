name: Deploy client

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require VITE_SERVER_URL
        env:
          SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: |
          if [ -z "$SERVER_URL" ]; then
            echo "::error::Repository variable VITE_SERVER_URL is empty. Set it with: gh variable set VITE_SERVER_URL --body https://<your-worker>.workers.dev"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/client
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          VITE_DEPLOY_VERSION: ${{ github.run_number }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/client/dist
      - id: deployment
        uses: actions/deploy-pages@v5
